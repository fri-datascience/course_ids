bookdown::gitbook:
  css: style.css
  split_by: chapter
  config:
    toc:
      collapse: subsection
      before: |
        <li><a href="./">Introduction to data science</a></li>
      after: |
        <li><a href="https://datascience.fri.uni-lj.si/" target="blank">Data Science Master's Program</a></li>
  includes:
    after_body: footer.html
bookdown::tufte_book2:
  latex_engine: xelatex
  pandoc_args: ["-V", "mainfont=TeX Gyre Pagella", "-V", "sansfont=TeX Gyre Heros",
                "-V", "monofont=DejaVu Sans Mono", "-V", "monofontoptions=Scale=0.85"]
  includes:
    in_header: preamble.tex
