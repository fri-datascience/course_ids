bookdown::gitbook:
  css: style.css
  split_by: chapter
  config:
    toc:
      collapse: subsection
      before: |
        <li><a href="./">Introduction to data science</a></li>
      after: |
        <li><a href="https://datascience.fri.uni-lj.si/" target="blank">Data Science Master's Program</a></li>
  includes:
    after_body: footer.html
bookdown::pdf_book:
  latex_engine: xelatex
  pandoc_args: ["-V", "mainfont=DejaVu Serif", "-V", "sansfont=DejaVu Sans", "-V", "monofont=DejaVu Sans Mono"]
  includes:
    in_header: preamble.tex
